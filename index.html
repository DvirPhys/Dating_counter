<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Time Together</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #fff6f8;
    font-family: system-ui, sans-serif;
    color: #443;
    text-align: center;
    padding: 24px;
  }
  .card {
    background: white;
    padding: 32px;
    border-radius: 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,.08);
    max-width: 420px;
    width: 100%;
  }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .date { opacity: .65; margin-bottom: 24px; }
  .stat {
    background: #fff0f4;
    border-radius: 16px;
    padding: 16px;
    margin: 10px 0;
  }
  .number {
    font-size: 2.2rem;
    font-weight: 700;
    color: #d6336c;
  }
  .label { font-size: .95rem; opacity: .75; }
</style>
</head>
<body>
  <div class="card">
    <h1>Wiebke Lea and Dvir</h1>
    <h1>Time since we started dating 💕</h1>
    <p class="date" id="startDate"></p>

    <div class="stat">
      <div class="number" id="days">0</div>
      <div class="label">days together</div>
    </div>

    <div class="stat">
      <div class="number" id="weeks">0</div>
      <div class="label">weeks together</div>
    </div>

    <div class="stat">
      <div class="number" id="months">0</div>
      <div class="label">full months together</div>
    </div>

    <div class="stat">
      <div class="number" id="ymd">0y 0m 0d</div>
      <div class="label">years, months and days</div>
    </div>
  </div>

<script>
  // Change this to the date you started dating.
  // Format: YYYY-MM-DD
  const START_DATE = new Date("2026-07-05T00:00:00");

  const now = new Date();

  // Calendar-day difference, ignoring time of day.
  const startDay = new Date(START_DATE.getFullYear(), START_DATE.getMonth(), START_DATE.getDate());
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

  const msPerDay = 24 * 60 * 60 * 1000;
  const totalDays = Math.floor((today - startDay) / msPerDay);
  const totalWeeks = Math.floor(totalDays / 7);

  // Full calendar months elapsed.
  let months = (today.getFullYear() - startDay.getFullYear()) * 12
             + (today.getMonth() - startDay.getMonth());

  // If today's day-of-month is before the anniversary day, subtract one month.
  if (today.getDate() < startDay.getDate()) months--;

  // Years, remaining months, remaining days.
  let years = Math.floor(months / 12);
  let remMonths = months % 12;

  let anniversary = new Date(startDay);
  anniversary.setMonth(anniversary.getMonth() + months);

  let remDays = Math.floor((today - anniversary) / msPerDay);
  if (remDays < 0) {
    remMonths--;
    if (remMonths < 0) {
      years--;
      remMonths += 12;
    }
    anniversary = new Date(startDay);
    anniversary.setMonth(anniversary.getMonth() + months - 1);
    remDays = Math.floor((today - anniversary) / msPerDay);
  }

  document.getElementById("startDate").textContent =
    "Since " + startDay.toLocaleDateString(undefined, {
      year: "numeric", month: "long", day: "numeric"
    });

  document.getElementById("days").textContent = totalDays.toLocaleString();
  document.getElementById("weeks").textContent = totalWeeks.toLocaleString();
  document.getElementById("months").textContent = Math.max(0, months).toLocaleString();
  document.getElementById("ymd").textContent =
    `${years}y ${remMonths}m ${remDays}d`;
</script>
</body>
</html>
