<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Date Test</title>
</head>
<body style="font-family: system-ui; padding: 20px;">

<h2>Date counter test</h2>

<p><b>Start date:</b> <span id="start"></span></p>
<p><b>Current date:</b> <span id="now"></span></p>
<p><b>Elapsed milliseconds:</b> <span id="elapsed"></span></p>
<p><b>Days:</b> <span id="days"></span></p>
<p><b>Hours:</b> <span id="hours"></span></p>
<p><b>Minutes:</b> <span id="minutes"></span></p>
<p><b>Seconds:</b> <span id="seconds"></span></p>

<script>
  const START_DATE = new Date("2026-07-05T16:34:00");

  function update() {
    const now = new Date();
    const elapsed = now - START_DATE;

    document.getElementById("start").textContent = START_DATE.toString();
    document.getElementById("now").textContent = now.toString();
    document.getElementById("elapsed").textContent = elapsed.toLocaleString();

    if (elapsed < 0) {
      document.getElementById("days").textContent = "Start date is in the future";
      document.getElementById("hours").textContent = "-";
      document.getElementById("minutes").textContent = "-";
      document.getElementById("seconds").textContent = "-";
      return;
    }

    document.getElementById("days").textContent =
      Math.floor(elapsed / (1000 * 60 * 60 * 24));

    document.getElementById("hours").textContent =
      Math.floor(elapsed / (1000 * 60 * 60));

    document.getElementById("minutes").textContent =
      Math.floor(elapsed / (1000 * 60));

    document.getElementById("seconds").textContent =
      Math.floor(elapsed / 1000);
  }

  update();
  setInterval(update, 1000);
</script>

</body>
</html>
